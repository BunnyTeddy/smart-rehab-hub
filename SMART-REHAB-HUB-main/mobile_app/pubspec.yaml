name: mobile_app
description: "Smart Rehab 5G - Mobile Application."
publish_to: 'none'

version: 1.2.1-rc3+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Bộ thư viện Google Firebase đồng bộ thế hệ mới
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.0

  # Giao diện & Tiện ích
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.5
  image_picker: ^1.2.2
  firebase_storage: ^12.4.10
  flutter_reactive_ble: 5.4.0
  cryptography: 2.7.0
  flutter_secure_storage: 9.2.4
  mobile_scanner: 7.0.1
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
